name: Bug in the helper scripts
description: A helper script (dirty-status decoder, trace-request validator, association converter) doesn't work
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command run and the error. Remove tokens, passwords and internal URLs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Python 3.11, Pro 3.5, Enterprise 11.5, UN v7"
    validations:
      required: true
