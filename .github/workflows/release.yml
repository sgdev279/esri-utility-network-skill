name: Release
on:
  release:
    types: [published]   # publish a release in GitHub's UI to ship a version

permissions:
  contents: write
  id-token: write   # PyPI trusted publishing + MCP Registry OIDC

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Package the skill
        run: |
          cd plugins/utility-network/skills
          zip -r ../../../utility-network.skill utility-network -x "*/__pycache__/*"

      - name: Attach the .skill file to the release
        uses: softprops/action-gh-release@v2
        with:
          files: utility-network.skill

      - name: Build MCP package
        run: pip install build && python -m build mcp-server

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: mcp-server/dist/
          skip-existing: true   # re-running a release shouldn't fail on an already-uploaded version

      - name: Publish to the MCP Registry
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sleep 60   # let PyPI serve the new release before the registry verifies it
          cd mcp-server
          ../mcp-publisher login github-oidc
          if ! out=$(../mcp-publisher publish 2>&1); then
            echo "$out"
            if echo "$out" | grep -q "duplicate version"; then
              echo "This version is already in the MCP Registry - nothing to do."
            else
              exit 1
            fi
          else
            echo "$out"
          fi
