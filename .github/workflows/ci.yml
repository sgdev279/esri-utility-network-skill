name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install "mcp[cli]<2" requests pyyaml build
      - name: JSON manifests are valid
        run: |
          for f in .claude-plugin/marketplace.json plugins/utility-network/.claude-plugin/plugin.json mcp-server/server.json plugins/utility-network/skills/utility-network/evals/*.json; do
            python -m json.tool "$f" > /dev/null && echo "ok $f"
          done
      - name: SKILL.md frontmatter
        run: |
          python - <<'PY'
          import yaml
          s = open("plugins/utility-network/skills/utility-network/SKILL.md").read()
          fm = yaml.safe_load(s.split("---")[1])
          assert fm["name"] == "utility-network"
          assert 0 < len(fm["description"]) <= 1024, len(fm["description"])
          assert "<" not in fm["description"] and ">" not in fm["description"]
          print("frontmatter ok")
          PY
      - name: Lint reference files
        run: python tools/lint_references.py
      - name: Freshness report is up to date
        run: |
          python tools/freshness_report.py
          git diff --exit-code docs/FRESHNESS.md || (echo "::warning::docs/FRESHNESS.md is out of date — run python tools/freshness_report.py and commit"; true)
      - name: MCP server copies are identical
        run: cmp plugins/utility-network/skills/utility-network/scripts/un_mcp_server.py mcp-server/src/utility_network_mcp/server.py
      - name: Script self-tests
        run: |
          cd plugins/utility-network/skills/utility-network/scripts
          python un_mcp_server.py --selftest
          python decode_dirty_status.py 0 10 40
          python association_types.py --table
      - name: Build MCP package
        run: python -m build mcp-server
