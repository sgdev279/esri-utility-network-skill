[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "utility-network-mcp"
version = "0.2.0"
description = "MCP server for the Esri ArcGIS Utility Network: trace, subnetworks, dirty areas and associations over the UtilityNetworkServer REST API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Sayanta Ghosh" }]
keywords = ["mcp", "esri", "arcgis", "utility-network", "gis", "model-context-protocol"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = ["mcp>=1.2,<2", "requests>=2.31"]

[project.urls]
Homepage = "https://github.com/sgdev279/esri-utility-network-skill"
Repository = "https://github.com/sgdev279/esri-utility-network-skill"

[project.scripts]
utility-network-mcp = "utility_network_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/utility_network_mcp"]
